<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1600" height="1100" fill="#F7FAFC"/><text x="55" y="57" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#137D78" font-weight="700">FIELD4  /  HARDWARE DESIGN PROPOSAL</text><text x="55" y="106" font-family="DejaVu Sans, sans-serif" font-size="38" fill="#142D40" font-weight="700">Separate quiet logic power from switched motor power.</text><text x="55" y="146" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#496476" font-weight="400">Functional power / stop schematic. Contactor, fuse, wire, watchdog and regen component ratings remain open.</text><text x="55" y="1065" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#496476" font-weight="400">12 OCT 2026  •  Verify exact hardware and all open items before energising motors.</text><text x="1490" y="1065" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#137D78" font-weight="700">03</text><rect x="55" y="200" width="310" height="158" rx="15" fill="white" stroke="#2477A7" stroke-width="2"/><rect x="55" y="200" width="310" height="8" rx="3" fill="#2477A7" stroke="#2477A7" stroke-width="2"/><text x="75" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#2477A7" font-weight="700">BENCH MOTOR SOURCE</text><text x="75" y="277" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Tekpower TP3005T</text><text x="75" y="306" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">Set 12.0 V; 5 A total maximum</text><text x="75" y="335" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">Begin with one unloaded motor</text><rect x="430" y="200" width="245" height="158" rx="15" fill="white" stroke="#99671A" stroke-width="2"/><rect x="430" y="200" width="245" height="8" rx="3" fill="#99671A" stroke="#99671A" stroke-width="2"/><text x="450" y="241" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#99671A" font-weight="700">INPUT PROTECTION</text><text x="450" y="277" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">F1 near source</text><text x="450" y="306" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#142D40" font-weight="400">Reverse-polarity protection</text><text x="450" y="335" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">Keyed, rated connector</text><rect x="735" y="200" width="295" height="158" rx="15" fill="white" stroke="#B54440" stroke-width="2"/><rect x="735" y="200" width="295" height="8" rx="3" fill="#B54440" stroke="#B54440" stroke-width="2"/><text x="755" y="241" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#B54440" font-weight="700">K1  •  MOTOR CONTACTOR</text><text x="755" y="277" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#142D40" font-weight="400">DC-rated normally-open contact</text><text x="755" y="306" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">Hardwired de-energise-to-stop</text><text x="755" y="335" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">Manual-reset run latch</text><rect x="1120" y="200" width="425" height="158" rx="15" fill="white" stroke="#2477A7" stroke-width="2"/><rect x="1120" y="200" width="425" height="8" rx="3" fill="#2477A7" stroke="#2477A7" stroke-width="2"/><text x="1140" y="241" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#2477A7" font-weight="700">SWITCHED MOTOR BUS</text><text x="1140" y="277" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Branch fuses F2-F5 → VIN of 4 drivers</text><text x="1140" y="306" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Individual driver returns → GND star</text><text x="1140" y="335" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Never drive motors through Pi/Pico</text><path d="M 365,280 L 430,280" fill="none" stroke="#B54440" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 675,280 L 735,280" fill="none" stroke="#B54440" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 1030,280 L 1120,280" fill="none" stroke="#B54440" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1120" y="420" width="425" height="180" rx="15" fill="white" stroke="#99671A" stroke-width="2"/><rect x="1120" y="420" width="425" height="8" rx="3" fill="#99671A" stroke="#99671A" stroke-width="2"/><text x="1140" y="461" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#99671A" font-weight="700">LOCAL ENERGY MANAGEMENT</text><text x="1140" y="497" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Local bulk / bypass after each driver fuse</text><text x="1140" y="526" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">Common + isolated-branch energy protection</text><text x="1140" y="555" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Must remain on DRIVER side of K1</text><text x="1140" y="584" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">TVS alone is not a braking-energy design</text><path d="M 1330,358 L 1330,420" fill="none" stroke="#B54440" stroke-width="3"  /><rect x="55" y="430" width="310" height="170" rx="15" fill="white" stroke="#137D78" stroke-width="2"/><rect x="55" y="430" width="310" height="8" rx="3" fill="#137D78" stroke="#137D78" stroke-width="2"/><text x="75" y="471" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#137D78" font-weight="700">LOGIC POWER  •  SEPARATE</text><text x="75" y="507" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">Pi 4 USB-C: suitable 5.1 V / 3 A</text><text x="75" y="536" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">Pi USB powers Pico for bench</text><text x="75" y="565" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#142D40" font-weight="400">Protected 5 V encoder rail required</text><text x="75" y="594" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">No parallel 5 V supplies</text><rect x="430" y="430" width="600" height="170" rx="15" fill="white" stroke="#137D78" stroke-width="2"/><rect x="430" y="430" width="600" height="8" rx="3" fill="#137D78" stroke="#137D78" stroke-width="2"/><text x="450" y="471" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#137D78" font-weight="700">GROUND / HARNESS RULES</text><text x="450" y="507" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Motor source −, drivers and signal GND share a reference.</text><text x="450" y="536" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Use a power-star / low-impedance distribution layout.</text><text x="450" y="565" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Keep motor return current out of sensor/USB ground paths.</text><text x="450" y="594" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Check earth paths through PSU, USB and test instruments.</text><rect x="55" y="690" width="420" height="175" rx="15" fill="white" stroke="#B54440" stroke-width="2"/><rect x="55" y="690" width="420" height="8" rx="3" fill="#B54440" stroke="#B54440" stroke-width="2"/><text x="75" y="731" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#B54440" font-weight="700">HARDWIRED E-STOP CHAIN</text><text x="75" y="767" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">Normally-closed button → run latch → K1 coil</text><text x="75" y="796" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">Wire break or loss of control power drops K1</text><text x="75" y="825" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Button release does NOT restore motion</text><text x="75" y="854" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">Coil suppression selected for drop-out time</text><rect x="590" y="690" width="425" height="175" rx="15" fill="white" stroke="#B54440" stroke-width="2"/><rect x="590" y="690" width="425" height="8" rx="3" fill="#B54440" stroke="#B54440" stroke-width="2"/><text x="610" y="731" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#B54440" font-weight="700">3.3 V INHIBIT GATE</text><text x="610" y="767" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">SN74LVC1G11: ARM AND RUN AND WD_OK</text><text x="610" y="796" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">External pulldowns; power-on inhibit</text><text x="610" y="825" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">Gate output → all 4 SLEEP pins</text><text x="610" y="854" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">No bypass jumper / direct 5 V SLEEP</text><rect x="1120" y="690" width="425" height="175" rx="15" fill="white" stroke="#137D78" stroke-width="2"/><rect x="1120" y="690" width="425" height="8" rx="3" fill="#137D78" stroke="#137D78" stroke-width="2"/><text x="1140" y="731" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#137D78" font-weight="700">PICO + INDEPENDENT WATCHDOG</text><text x="1140" y="767" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">GP16: software ARM request</text><text x="1140" y="796" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">GP19: watchdog service pulse</text><text x="1140" y="825" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">External watchdog / POR provides WD_OK</text><text x="1140" y="854" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Watchdog timeout latches RUN OFF</text><path d="M 475,760 L 590,760" fill="none" stroke="#B54440" stroke-width="3"  marker-end="url(#arrow)"/><text x="482" y="734" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#B54440" font-weight="400">RUN (3.3 V)</text><path d="M 1120,755 L 1015,755" fill="none" stroke="#B54440" stroke-width="3"  marker-end="url(#arrow)"/><text x="1032" y="724" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#B54440" font-weight="400">ARM / WD_OK</text><path d="M 267,690 L 267,630 L 390,630 L 390,385 L 875,385 L 875,358" fill="none" stroke="#B54440" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="300" y="668" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#B54440" font-weight="400">Hardwired coil control; GPIO never carries coil current</text><rect x="55" y="920" width="1490" height="100" rx="15" fill="#FFF4DF" stroke="#D5B77C" stroke-width="2"/><text x="76" y="955" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#B54440" font-weight="700">STOP IS NOT A BRAKE GUARANTEE.</text><text x="76" y="984" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142D40" font-weight="400">SLEEP low = high-impedance / coast. Measure coast distance. Source cut can leave stored or regenerative energy on the motor bus.</text><text x="76" y="1009" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Battery option stays open: a 4S LiFePO4 pack can reach 14.6 V, above these motors’ 12 V nominal rating.</text></svg>