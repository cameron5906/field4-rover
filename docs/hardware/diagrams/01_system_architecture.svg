<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1600" height="1100" fill="#F7FAFC"/><text x="55" y="57" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#137D78" font-weight="700">FIELD4  /  HARDWARE DESIGN PROPOSAL</text><text x="55" y="106" font-family="DejaVu Sans, sans-serif" font-size="38" fill="#142D40" font-weight="700">One onboard brain. One real-time motor controller.</text><text x="55" y="146" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#496476" font-weight="400">Pi 4 owns sensing and navigation; Pico owns wheel feedback, motion leases and fail-safe defaults.</text><text x="55" y="1065" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#496476" font-weight="400">12 OCT 2026  •  Verify exact hardware and all open items before energising motors.</text><text x="1490" y="1065" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#137D78" font-weight="700">02</text><rect x="55" y="200" width="340" height="175" rx="15" fill="white" stroke="#2477A7" stroke-width="2"/><rect x="55" y="200" width="340" height="8" rx="3" fill="#2477A7" stroke="#2477A7" stroke-width="2"/><text x="75" y="241" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#2477A7" font-weight="700">CAMERA  •  Arducam B0309</text><text x="75" y="277" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142D40" font-weight="400">IMX708 / fixed focus / CSI-2</text><text x="75" y="306" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142D40" font-weight="400">Pi 4: 15-pin CSI ribbon</text><text x="75" y="335" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">Mount + lens calibration needed</text><rect x="55" y="430" width="340" height="175" rx="15" fill="white" stroke="#2477A7" stroke-width="2"/><rect x="55" y="430" width="340" height="8" rx="3" fill="#2477A7" stroke="#2477A7" stroke-width="2"/><text x="75" y="471" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#2477A7" font-weight="700">LIDAR  •  RPLIDAR A1M8</text><text x="75" y="507" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142D40" font-weight="400">Factory USB adapter preferred</text><text x="75" y="536" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142D40" font-weight="400">Pi USB host / 115200 baud</text><text x="75" y="565" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142D40" font-weight="400">Verify revision + startup power</text><rect x="55" y="660" width="340" height="175" rx="15" fill="white" stroke="#2477A7" stroke-width="2"/><rect x="55" y="660" width="340" height="8" rx="3" fill="#2477A7" stroke="#2477A7" stroke-width="2"/><text x="75" y="701" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#2477A7" font-weight="700">IMU  •  WT901 TTL</text><text x="75" y="737" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142D40" font-weight="400">3.3 V UART proposed to Pi</text><text x="75" y="766" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">Accel + gyro; magnetic yaw gated</text><text x="75" y="795" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">Mount axes + motor EMI calibration</text><rect x="515" y="200" width="500" height="365" rx="15" fill="white" stroke="#137D78" stroke-width="2"/><rect x="515" y="200" width="500" height="8" rx="3" fill="#137D78" stroke="#137D78" stroke-width="2"/><text x="535" y="241" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#137D78" font-weight="700">RASPBERRY PI 4</text><text x="535" y="277" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142D40" font-weight="400">Camera / lidar / IMU adapters</text><text x="535" y="306" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142D40" font-weight="400">Time alignment + health + raw logging</text><text x="535" y="335" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142D40" font-weight="400">Odometry, observed map, local planning</text><text x="535" y="364" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142D40" font-weight="400">Perception worker: latest frame only</text><text x="535" y="393" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142D40" font-weight="400">Mission state + UI + replay</text><text x="535" y="422" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142D40" font-weight="400">No direct GPIO motor PWM</text><rect x="515" y="655" width="500" height="275" rx="15" fill="white" stroke="#137D78" stroke-width="2"/><rect x="515" y="655" width="500" height="8" rx="3" fill="#137D78" stroke="#137D78" stroke-width="2"/><text x="535" y="696" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#137D78" font-weight="700">PICO  •  RP2040 PROPOSAL</text><text x="535" y="732" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142D40" font-weight="400">USB CDC framed motor protocol</text><text x="535" y="761" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142D40" font-weight="400">4 encoder counters + 4 wheel PI loops</text><text x="535" y="790" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142D40" font-weight="400">Bounded velocity / acceleration</text><text x="535" y="819" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#142D40" font-weight="400">Command expiry + fault latch + watchdog</text><text x="535" y="848" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142D40" font-weight="400">Boot and reconnect: DISARMED</text><rect x="1160" y="200" width="385" height="220" rx="15" fill="white" stroke="#2477A7" stroke-width="2"/><rect x="1160" y="200" width="385" height="8" rx="3" fill="#2477A7" stroke="#2477A7" stroke-width="2"/><text x="1180" y="241" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#2477A7" font-weight="700">DRIVE  •  FOUR CHANNELS</text><text x="1180" y="277" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142D40" font-weight="400">4 × Pololu DRV8874 #4035</text><text x="1180" y="306" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142D40" font-weight="400">One carrier per FIT0185 motor</text><text x="1180" y="335" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142D40" font-weight="400">4 × 96 mm wheels / 6 mm hubs</text><text x="1180" y="364" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142D40" font-weight="400">Separate encoder level interface</text><rect x="1160" y="535" width="385" height="255" rx="15" fill="white" stroke="#B54440" stroke-width="2"/><rect x="1160" y="535" width="385" height="8" rx="3" fill="#B54440" stroke="#B54440" stroke-width="2"/><text x="1180" y="576" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#B54440" font-weight="700">HARDWIRED STOP PATH</text><text x="1180" y="612" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142D40" font-weight="400">Latching NC E-stop + DC contactor</text><text x="1180" y="641" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142D40" font-weight="400">3.3 V inhibit gate + ext. watchdog</text><text x="1180" y="670" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142D40" font-weight="400">Driver SLEEP low defaults to coast</text><text x="1180" y="699" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142D40" font-weight="400">Physical reset + fresh software arm</text><text x="1180" y="728" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142D40" font-weight="400">Independent of Pi / model / Wi-Fi</text><rect x="1160" y="865" width="385" height="145" rx="15" fill="white" stroke="#99671A" stroke-width="2"/><rect x="1160" y="865" width="385" height="8" rx="3" fill="#99671A" stroke="#99671A" stroke-width="2"/><text x="1180" y="906" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#99671A" font-weight="700">ZERO W  •  OPTIONAL</text><text x="1180" y="942" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142D40" font-weight="400">Not needed for first architecture</text><text x="1180" y="971" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142D40" font-weight="400">Keep out of motor/safety chain</text><path d="M 395,285 L 470,285 L 470,280 L 515,280" fill="none" stroke="#2477A7" stroke-width="3"  marker-end="url(#arrow)"/><text x="410" y="252" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#496476" font-weight="400">CSI-2</text><path d="M 395,515 L 455,515 L 455,380 L 515,380" fill="none" stroke="#2477A7" stroke-width="3"  marker-end="url(#arrow)"/><text x="408" y="477" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#496476" font-weight="400">USB</text><path d="M 395,745 L 440,745 L 440,480 L 515,480" fill="none" stroke="#2477A7" stroke-width="3"  marker-end="url(#arrow)"/><text x="405" y="642" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#496476" font-weight="400">UART</text><path d="M 850,565 L 850,655" fill="none" stroke="#137D78" stroke-width="3"  marker-end="url(#arrow)"/><text x="532" y="598" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#496476" font-weight="400">USB: fresh 50 Hz setpoints</text><text x="532" y="627" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#496476" font-weight="400">sequence + session + deadline</text><path d="M 950,655 L 950,565" fill="none" stroke="#137D78" stroke-width="3"  marker-end="url(#arrow)"/><text x="960" y="615" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#496476" font-weight="400">feedback</text><text x="528" y="967" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#496476" font-weight="400">USB feedback: counts, wheel rates, fault/stop state, bus voltage</text><path d="M 1015,735 L 1100,735 L 1100,300 L 1160,300" fill="none" stroke="#2477A7" stroke-width="3"  marker-end="url(#arrow)"/><text x="1027" y="445" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#496476" font-weight="400">EN / PH</text><path d="M 1160,390 L 1075,390 L 1075,860 L 1015,860" fill="none" stroke="#2477A7" stroke-width="3"  marker-end="url(#arrow)"/><text x="1019" y="897" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#496476" font-weight="400">A/B feedback</text><path d="M 1160,680 L 1125,680 L 1125,480 L 1315,480 L 1315,420" fill="none" stroke="#B54440" stroke-width="3"  marker-end="url(#arrow)"/><text x="1170" y="460" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#B54440" font-weight="400">Power cut + inhibit</text><path d="M 1015,790 L 1160,790" fill="none" stroke="#B54440" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="1020" y="822" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#B54440" font-weight="400">ARM / WDI</text><rect x="55" y="920" width="340" height="90" rx="15" fill="#FFF4DF" stroke="#D5B77C" stroke-width="2"/><text x="72" y="952" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#99671A" font-weight="700">Cloud model: mission intent only.</text><text x="72" y="979" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#99671A" font-weight="400">No motor timing or stop guarantee.</text></svg>