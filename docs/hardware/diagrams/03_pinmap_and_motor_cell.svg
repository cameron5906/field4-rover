<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1600" height="1100" fill="#F7FAFC"/><text x="55" y="57" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#137D78" font-weight="700">FIELD4  /  HARDWARE DESIGN PROPOSAL</text><text x="55" y="106" font-family="DejaVu Sans, sans-serif" font-size="38" fill="#142D40" font-weight="700">Proposed GPIO map + repeatable one-wheel wiring cell.</text><text x="55" y="146" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#496476" font-weight="400">For original Raspberry Pi Pico / RP2040 only. Physical pin numbers must be checked against the actual board.</text><text x="55" y="1065" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#496476" font-weight="400">12 OCT 2026  •  Verify exact hardware and all open items before energising motors.</text><text x="1490" y="1065" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#137D78" font-weight="700">04</text><rect x="55" y="198" width="690" height="610" rx="15" fill="white" stroke="#137D78" stroke-width="2"/><text x="75" y="236" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#137D78" font-weight="700">PICO ASSIGNMENTS  •  FL / FR / RL / RR</text><rect x="70" y="254" width="660" height="43" rx="3" fill="#EDF4F6" stroke="#EDF4F6" stroke-width="2"/><text x="80" y="282" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="700">Wheel</text><text x="155" y="282" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="700">Encoder A/B (physical pins)</text><text x="438" y="282" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="700">EN / PH (physical pins)</text><text x="80" y="330" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">FL</text><text x="155" y="330" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">GP0 / GP1  (1 / 2)</text><text x="438" y="330" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">GP8 / GP9  (11 / 12)</text><rect x="70" y="350" width="660" height="43" rx="3" fill="#EDF4F6" stroke="#EDF4F6" stroke-width="2"/><text x="80" y="378" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">FR</text><text x="155" y="378" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">GP2 / GP3  (4 / 5)</text><text x="438" y="378" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">GP10 / GP11  (14 / 15)</text><text x="80" y="426" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">RL</text><text x="155" y="426" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">GP4 / GP5  (6 / 7)</text><text x="438" y="426" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">GP12 / GP13  (16 / 17)</text><rect x="70" y="446" width="660" height="43" rx="3" fill="#EDF4F6" stroke="#EDF4F6" stroke-width="2"/><text x="80" y="474" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">RR</text><text x="155" y="474" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">GP6 / GP7  (9 / 10)</text><text x="438" y="474" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">GP14 / GP15  (19 / 20)</text><text x="80" y="553" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#137D78" font-weight="700">GP16 / pin 21</text><text x="275" y="553" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">ARM request to inhibit gate</text><text x="80" y="586" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#137D78" font-weight="700">GP17 / pin 22</text><text x="275" y="586" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">Common open-drain FAULT; 3.3 V pull-up</text><text x="80" y="619" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#137D78" font-weight="700">GP18 / pin 24</text><text x="275" y="619" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">Dry-contact RUN feedback; fail-low</text><text x="80" y="652" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#137D78" font-weight="700">GP19 / pin 25</text><text x="275" y="652" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">External watchdog service</text><text x="80" y="685" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#137D78" font-weight="700">GP20/21 / 26/27</text><text x="275" y="685" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">I2C0 reserved for conditioned 4-channel ADC</text><text x="80" y="718" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#137D78" font-weight="700">GP26 / pin 31</text><text x="275" y="718" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">Motor bus sense via protected divider</text><text x="80" y="751" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#137D78" font-weight="700">GP22/27/28</text><text x="275" y="751" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">Spare pins 29/32/34; GP27/28 are ADC-capable</text><text x="80" y="786" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">USB power only; GND pins 3/8/13/18/23/28/38. 3V3 OUT = pin 36.</text><rect x="810" y="198" width="365" height="200" rx="15" fill="white" stroke="#2477A7" stroke-width="2"/><rect x="810" y="198" width="365" height="8" rx="3" fill="#2477A7" stroke="#2477A7" stroke-width="2"/><text x="830" y="239" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#2477A7" font-weight="700">ONE DRV8874 #4035</text><text x="830" y="275" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">VIN ← switched 12 V motor bus</text><text x="830" y="304" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">GND ← power return + signal reference</text><text x="830" y="333" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">EN ← PWM; PH ← direction</text><text x="830" y="362" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142D40" font-weight="400">PMODE = GND; IMODE = GND</text><rect x="1260" y="198" width="285" height="200" rx="15" fill="white" stroke="#2477A7" stroke-width="2"/><rect x="1260" y="198" width="285" height="8" rx="3" fill="#2477A7" stroke="#2477A7" stroke-width="2"/><text x="1280" y="239" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#2477A7" font-weight="700">FIT0185 MOTOR</text><text x="1280" y="275" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">OUT1 / OUT2 → motor pair</text><text x="1280" y="304" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">Do not infer wire colours</text><text x="1280" y="333" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#142D40" font-weight="400">Encoder power = regulated 5 V</text><text x="1280" y="362" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">A/B signal level unconfirmed</text><path d="M 1175,282 L 1260,282" fill="none" stroke="#2477A7" stroke-width="3"  marker-end="url(#arrow)"/><rect x="810" y="470" width="365" height="170" rx="15" fill="white" stroke="#99671A" stroke-width="2"/><rect x="810" y="470" width="365" height="8" rx="3" fill="#99671A" stroke="#99671A" stroke-width="2"/><text x="830" y="511" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#99671A" font-weight="700">CURRENT LIMIT  •  EACH BOARD</text><text x="830" y="547" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">Add 10 kΩ from VREF to GND (proposal)</text><text x="830" y="576" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">With 3.3 V SLEEP: ~1.46 A nominal</text><text x="830" y="605" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#142D40" font-weight="400">Measure before loading; tolerance matters</text><text x="830" y="634" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">CS → conditioned ADC, never raw 5 V</text><path d="M 993,470 L 993,398" fill="none" stroke="#99671A" stroke-width="3"  /><rect x="1260" y="470" width="285" height="170" rx="15" fill="white" stroke="#137D78" stroke-width="2"/><rect x="1260" y="470" width="285" height="8" rx="3" fill="#137D78" stroke="#137D78" stroke-width="2"/><text x="1280" y="511" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#137D78" font-weight="700">ENCODER INTERFACE</text><text x="1280" y="547" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">SN74LVC541A at 3.3 V</text><text x="1280" y="576" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">8 inputs accept up to 5.5 V</text><text x="1280" y="605" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142D40" font-weight="400">Outputs → Pico GP0-GP7</text><text x="1280" y="634" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#142D40" font-weight="400">Output topology / pull-ups: verify</text><path d="M 1400,398 L 1400,470" fill="none" stroke="#137D78" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 1400,640 L 1400,675 L 780,675 L 780,835 L 675,835 L 675,808" fill="none" stroke="#137D78" stroke-width="3"  marker-end="url(#arrow)"/><rect x="810" y="700" width="735" height="155" rx="15" fill="white" stroke="#B54440" stroke-width="2"/><rect x="810" y="700" width="735" height="8" rx="3" fill="#B54440" stroke="#B54440" stroke-width="2"/><text x="830" y="741" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#B54440" font-weight="700">ENABLE, FAULT AND ZERO COMMAND</text><text x="830" y="777" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">SLEEP ← common 3.3 V gate only. Add 10 kΩ SLEEP-to-GND.</text><text x="830" y="806" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">All FAULT outputs may join one pull-up to 3.3 V; source ID is lost.</text><text x="830" y="835" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142D40" font-weight="400">PH/EN: EN=0 brakes while awake; SLEEP=0 coasts. No automatic re-arm.</text><rect x="55" y="885" width="1490" height="135" rx="15" fill="#EDF4F6" stroke="#B5CDCF" stroke-width="2"/><text x="76" y="922" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#137D78" font-weight="700">PI 4 CONNECTIONS</text><text x="76" y="955" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142D40" font-weight="400">B0309 → 15-pin CSI camera port    |    A1M8 → matching factory USB adapter    |    Pico → Pi USB host</text><text x="76" y="987" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142D40" font-weight="400">WT901 TTL: VCC ← Pi pin 1 (3.3 V), GND ← pin 6, TX → pin 10 / GPIO15, RX ← pin 8 / GPIO14.</text><text x="76" y="1010" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#B54440" font-weight="400">Verify TTL variant and 3.3 V signal swing first; never connect RS-232, RS-485 or 5 V TX directly to the Pi.</text></svg>