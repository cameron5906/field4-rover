loor underside: Z25  |  nominal clearance 25</text><text x="240" y="229.4" font-family="Arial, Helvetica, sans-serif" font-size="2.8927777777777774" font-weight="normal" fill="#172c39" text-anchor="start">Lowest fastener clearance: approximately 17.5</text><text x="240" y="234.8" font-family="Arial, Helvetica, sans-serif" font-size="2.8927777777777774" font-weight="normal" fill="#172c39" text-anchor="start">Lower shell + lid max XY: 236 x 196</text><text x="240" y="240.2" font-family="Arial, Helvetica, sans-serif" font-size="2.8927777777777774" font-weight="normal" fill="#172c39" text-anchor="start">P1S print XY, rotated 90 deg: 196 x 236; 6 mm brim: 208 x 248</text><text x="240" y="245.6" font-family="Arial, Helvetica, sans-serif" font-size="2.8927777777777774" font-weight="normal" fill="#172c39" text-anchor="start">+Y side panel projects 3 beyond the body; within tire envelope.</text><line x1="14" y1="256" x2="406" y2="256" stroke="#c7d2d8" stroke-width="0.25" fill="none"/><text x="14" y="263" font-family="Arial, Helvetica, sans-serif" font-size="2.998611111111111" font-weight="bold" fill="#b75218" text-anchor="start">DESIGN STATUS</text><text x="48" y="263" font-family="Arial, Helvetica, sans-serif" font-size="2.998611111111111" font-weight="normal" fill="#172c39" text-anchor="start">Purchased wheels and screw heads are nominal references. Tread shape, load compression and real hardware can change the assembled envelope.</text><text x="48" y="268" font-family="Arial, Helvetica, sans-serif" font-size="2.998611111111111" font-weight="normal" fill="#172c39" text-anchor="start">These are assembly-layout drawings, not fabrication tolerances. Check the actual P1S profile, stock exclusion zone, and fit coupons before full prints.</text><line x1="14" y1="282" x2="406" y2="282" stroke="#c7d2d8" stroke-width="0.25" fill="none"/><text x="14" y="288" font-family="Arial, Helvetica, sans-serif" font-size="2.822222222222222" font-weight="normal" fill="#526874" text-anchor="start">All dimensions mm. Dimensions govern; do not scale screenshots. A3 landscape PDF is vector artwork.</text><text x="406" y="288" font-family="Arial, Helvetica, sans-serif" font-size="2.822222222222222" font-weight="normal" fill="#526874" text-anchor="end">1 / 2</text></svg>